name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-azure.yml'

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test & Deploy SmartDocument to Azure
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn -B package -DskipTests

      - name: Log in to Azure
        uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Build & Deploy via Azure CLI
        if: env.AZURE_CREDENTIALS != ''
        run: |
          chmod +x scripts/deploy-azure.sh
          ./scripts/deploy-azure.sh

      - name: Report deploy status
        if: always()
        run: |
          if [ -z "${AZURE_CREDENTIALS:-}" ]; then
            echo "::warning title=Azure credentials not set::Deploy step skipped; build verified."
          else
            echo "Azure login and deploy executed."
          fi
