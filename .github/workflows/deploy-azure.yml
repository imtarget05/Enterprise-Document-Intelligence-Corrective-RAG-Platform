name: Deploy SmartDoc RAG API to Azure

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI/CD Pipeline]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test & Deploy SmartDocument to Azure
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn -B package -DskipTests

      - name: Log in to Azure
        uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Build & Deploy via Azure CLI
        if: env.AZURE_CREDENTIALS != ''
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 -m pip install requests
          chmod +x scripts/deploy-azure.sh
          ./scripts/deploy-azure.sh

      - name: Verify Azure backend readiness
        if: env.AZURE_CREDENTIALS != ''
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          targets = (
              ("backend", "https://smartdoc-api.blackisland-5a3f0246.southeastasia.azurecontainerapps.io/api/actuator/health", "UP"),
          )
          for name, url, expected in targets:
              for attempt in range(1, 11):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          status = json.load(response).get("status")
                      if status == expected:
                          print(f"{name} ready on attempt {attempt}")
                          break
                  except (OSError, ValueError, urllib.error.HTTPError):
                      pass
                  if attempt == 10:
                      raise SystemExit(f"{name} never reported {expected} readiness")
                  time.sleep(15)
          PY

      - name: Browser auth and RAG business smoke
        if: env.AZURE_CREDENTIALS != ''
        run: |
          python3 -m pip install requests
          python3 -u scripts/production_smoke.py \
            --mode rag \
            --browser-origin https://smart-doc-chatbot.pages.dev \
            --base-url https://smartdoc-api.blackisland-5a3f0246.southeastasia.azurecontainerapps.io/api

      - name: Report agent feature readiness
        if: env.AZURE_CREDENTIALS != ''
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = 'https://smartdoc-agent.blackisland-5a3f0246.southeastasia.azurecontainerapps.io/ready'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  ready = json.load(response).get('status') == 'ok'
          except (OSError, ValueError):
              ready = False
          if ready:
              print('Agent feature ready')
          else:
              print('::warning::RAG API passed, but agent feature is not ready; do not claim HITL/agent live.')
          PY

      - name: Record deployed source revision
        if: env.AZURE_CREDENTIALS != ''
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: printf '%s\n' "$SOURCE_SHA" > source_sha.txt

      - uses: actions/upload-artifact@v4
        if: env.AZURE_CREDENTIALS != ''
        with:
          name: smartdoc-source
          path: source_sha.txt
          if-no-files-found: error

      - name: Report deploy status
        if: always()
        run: |
          if [ -z "${AZURE_CREDENTIALS:-}" ]; then
            echo "::error title=Azure deploy NOT run::AZURE_CREDENTIALS is missing; build-only is not a successful deployment." >&2
            exit 1
          else
            echo "Azure credentials supplied; check RAG smoke and agent warning above. Agent readiness is reported separately."
          fi
