# ============================================
# CD Pipeline - Vetted Image Build & Release
# Triggers: push to main (image build), version tags (production release)
#
# Deployment itself is NOT GitOps-managed: backend + llm-router deploy via
# the Render blueprint (render.yaml, autoDeploy on push) and the frontend via
# Cloudflare Pages. This workflow produces vetted images in GHCR (consumed by
# Render blueprint services or manual pulls) and creates GitHub releases.
# ============================================

name: CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================
  # STAGE 1: Build & Push Vetted Images
  # ============================================================

  build-and-push:
    name: "1. Build & Push Vetted Images"
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
      backend-image: ${{ steps.image-names.outputs.backend }}
      frontend-image: ${{ steps.image-names.outputs.frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate lowercase image names
        id: image-names
        run: |
          BACKEND_IMAGE="${{ github.repository }}/backend"
          FRONTEND_IMAGE="${{ github.repository }}/frontend"
          echo "backend=$(echo $BACKEND_IMAGE | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "frontend=$(echo $FRONTEND_IMAGE | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.backend }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.backend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.frontend }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.frontend }}:latest
          build-args: |
            VITE_API_URL=https://smartdoc-api.blackisland-5a3f0246.southeastasia.azurecontainerapps.io/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # STAGE 2: Post-build readiness verification (Render autoDeploy plane)
  # ============================================================
  # Render deploys backend via blueprint autoDeploy on push; this polls the
  # live /api/actuator/health so a green CD run means a healthy backend.
  # Canonical loop lives in render-readiness.yml (synced from docs/).

  verify-readiness:
    name: "2. Verify backend readiness (Render)"
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    uses: ./.github/workflows/render-readiness.yml
    with:
      health-path: /api/actuator/health
      attempts: '10'
      interval-seconds: '15'
    secrets:
      render-api-key: ${{ secrets.RENDER_API_KEY }}
      render-service-id: ${{ secrets.RENDER_SERVICE_ID }}

  # ============================================================
  # STAGE 3: Versioned Release (tags only)
  # ============================================================

  release:
    name: "3. Create GitHub Release"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
