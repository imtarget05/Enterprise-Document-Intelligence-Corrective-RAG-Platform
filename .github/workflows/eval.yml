name: "3. Eval & Regression"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Backend API base URL (optional: eval a live deployment; default = local mock stack)"
        required: false
        default: ""
      run_full_suite:
        description: "Run the full 31-question suite instead of the fast fixture set"
        type: boolean
        default: false

jobs:
  fixture-smoke:
    name: "Fixture Smoke Test (Mock Stack, Non-Gating)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pytest fastapi uvicorn httpx

      # Offline, deterministic grader unit tests (no network, no LLM).
      - name: Offline grader tests
        run: python -m pytest eval/tests/test_grader.py -q

      # Hermetic local LLM stack: mock Ollama (Ollama protocol, :11434) plus a
      # mock backend (:8081). No Render/cloud-LLM dependency — the eval can no
      # longer fail because a free-tier staging server is asleep.
      - name: Start local LLM stack (mock Ollama + mock backend)
        run: |
          nohup python eval/mock_ollama.py > /tmp/mock_ollama.log 2>&1 &
          nohup python eval/mock_backend.py > /tmp/mock_backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/health > /dev/null && \
               curl -sf http://127.0.0.1:8081/api/actuator/health > /dev/null; then
              echo "✅ Local LLM stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Local LLM stack failed to start"
          cat /tmp/mock_ollama.log /tmp/mock_backend.log
          exit 1

      # Pass --base-url via workflow_dispatch to eval a live deployment instead.
      - name: Run fixture benchmark (fast gate)
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:8081/api' }}
        run: |
          python eval/run_fixture_eval.py --base-url "$BASE_URL" \
            --output eval/results/fixture_eval.json

      - name: Run full question suite (optional)
        if: ${{ inputs.run_full_suite == true }}
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:8081/api' }}
        run: |
          python eval/run_fixture_eval.py --base-url "$BASE_URL" \
            --questions eval/questions.json \
            --output eval/results/full_eval.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval/results/

      - name: Summarize
        if: always()
        run: |
          python - <<'PYEOF'
          import json, pathlib
          p = pathlib.Path("eval/results/fixture_eval.json")
          if p.exists():
              d = json.loads(p.read_text())
              s = d.get("summary", d)
              print(f"Fixture benchmark: errors={s.get('error_count')} "
                    f"provider_errors={s.get('provider_errors')} "
                    f"retrieval={s.get('retrieval_accuracy')} "
                    f"correctness={s.get('answer_correctness')} "
                    f"hallucinations={s.get('hallucination_cases')}")
          PYEOF

  live-benchmark:
    name: "Live Retrieval & LLM Benchmark (Production Stack)"
    if: ${{ inputs.base_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run live benchmark
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          python eval/run_live_benchmark.py --base-url "$BASE_URL" \
            --questions eval/questions.json \
            --output eval/results/live_benchmark.json

      - name: Upload live benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-benchmark-report
          path: eval/results/live_benchmark.json

  e2e-fullstack:
    name: "Full-stack E2E smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # UI smoke against the built preview bundle (hermetic).
      - name: UI smoke tests
        working-directory: frontend
        run: npx playwright test e2e/auth.spec.ts

      # Full-stack API smoke against the local mock backend (:8081) — hermetic,
      # no Render dependency. Covers CSRF handshake → register → login →
      # upload → chat ask end-to-end through the HTTP surface the frontend uses.
      - name: Start local mock backend
        run: |
          pip install --quiet fastapi uvicorn
          nohup python eval/mock_backend.py > /tmp/mock_backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/api/actuator/health > /dev/null && { echo "✅ mock backend up"; exit 0; }
            sleep 2
          done
          echo "❌ mock backend failed to start"
          cat /tmp/mock_backend.log
          exit 1

      - name: Full-stack API smoke tests
        working-directory: frontend
        env:
          E2E_API_URL: http://127.0.0.1:8081/api
        run: npx playwright test e2e/fullstack-smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
