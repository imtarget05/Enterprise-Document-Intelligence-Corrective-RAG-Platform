name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Backend Tests
  # ═══════════════════════════════════════════════════════════════
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smartdoc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartdoc_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS10ZXN0aW5nLTIwMjQ=
          INTERNAL_SERVICE_TOKEN: test-internal-token
          MAVEN_OPTS: --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
        run: mvn clean verify -B

      - name: Check backend coverage threshold
        working-directory: ./backend
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "⚠️ No JaCoCo report found"
            exit 0
          fi
          # The jacoco-maven-plugin `check` goal already gates BUNDLE line
          # coverage at 65% during `mvn verify`; this surfaces the number in
          # the CI log as well.
          python3 -c 'import sys, xml.etree.ElementTree as ET; r = ET.parse("target/site/jacoco/jacoco.xml").getroot(); c = [x for x in r.findall("counter") if x.get("type") == "LINE"][0]; m, k = int(c.get("missed")), int(c.get("covered")); t = m + k; p = k / t if t else 0; print(f"Line coverage: {p:.2%} ({k}/{t})"); sys.exit(0 if p >= 0.65 else 1)'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ═══════════════════════════════════════════════════════════════
  # Frontend Tests
  # ═══════════════════════════════════════════════════════════════
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        # `npm test` runs `vitest run` WITHOUT coverage; `test:coverage` is the
        # script that collects coverage AND enforces vite.config.ts thresholds.
        # Use it explicitly — otherwise no lcov.info is produced and this job
        # would report a green build with zero coverage enforcement.
        run: npm run test:coverage

      - name: Check frontend coverage threshold
        working-directory: ./frontend
        run: |
          # Vitest enforces the coverage thresholds (lines/statements 80,
          # branches 70, functions 65) at test time, so a shortfall already
          # failed the previous step. Here we surface the number — but a
          # missing report means coverage never ran, which must fail loudly
          # rather than silently passing.
          if [ ! -f coverage/lcov.info ]; then
            echo "ERROR: coverage/lcov.info was not produced — coverage did not run."
            exit 1
          fi
          python3 - <<'PYEOF'
          import sys
          lh = lf = 0
          with open("coverage/lcov.info") as f:
              for line in f:
                  if line.startswith("LH:"):
                      lh += int(line[3:])
                  elif line.startswith("LF:"):
                      lf += int(line[3:])
          pct = (lh / lf * 100) if lf else 0.0
          print(f"Line coverage: {pct:.2f}% ({lh}/{lf})")
          PYEOF

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/

  # ════════════════════════════════════════════════════════════════
  # Frontend E2E Tests (Playwright)
  # ════════════════════════════════════════════════════════════════
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run hermetic E2E tests (chat-ui)
        working-directory: ./frontend
        run: npx playwright test e2e/chat-ui.spec.ts --project=chromium

      - name: Run fullstack E2E tests (opt-in)
        if: env.E2E_API_URL != ''
        working-directory: ./frontend
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: npx playwright test e2e/fullstack-smoke.spec.ts e2e/chat-flow.spec.ts e2e/documents.spec.ts e2e/admin-ui.spec.ts --project=chromium

  # ════════════════════════════════════════════════════════════════
  # Agent Tests
  # ════════════════════════════════════════════════════════════════
  agent-test:
    name: Agent Tests
    runs-on: ubuntu-latest
    env:
      # APP_ENV must be "test": conftest.py setdefaults APP_ENV=test, the API
      # auth deps accept the unit-test tokens only in test mode, and
      # test_workflow_checkpointer asserts APP_ENV == "test". Any other
      # permissive value (e.g. "local") still fail-closes auth on unconfigured
      # tokens → 401 across the HITL/adk/report endpoint tests. Real credentials
      # are validated at deploy time in production, not in these unit tests.
      APP_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run agent tests
        working-directory: ./agent
        run: python -m pytest tests/ -q

  # ═══════════════════════════════════════════════════════════════
  # Offline Eval Grader Tests (zero network / zero LLM)
  # ═══════════════════════════════════════════════════════════════
  eval-grader:
    name: Eval Grader Tests (offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline grader tests
        run: |
          # eval/eval.py (unit under test) imports `requests` at module load.
          python -m pip install --quiet pytest requests
          python -m pytest eval/tests/test_grader.py -q

  # ═══════════════════════════════════════════════════════════════
  # LLM Judge Mock Evaluation (deterministic, no LLM API)
  # ═══════════════════════════════════════════════════════════════
  eval-llm-judge-mock:
    name: LLM Judge Mock (golden 50)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install judge dependencies
        run: python -m pip install --quiet requests pytest

      - name: Validate golden dataset size
        run: |
          python -c "import json; d=json.load(open('eval/golden_dataset.json')); assert len(d)>=50, f'golden_dataset.json has {len(d)} <50 entries'; print(f'Golden dataset: {len(d)} entries OK')"

      - name: Run LLM judge mock evaluation
        run: |
          python -c "
          import json
          from eval.llm_judge import LLMJudge
          golden=json.load(open('eval/golden_dataset.json'))
          judge=LLMJudge(mock=True)
          scores=[]
          for item in golden:
              q=item['question']; a=item['golden_answer']; ctx=' '.join(item.get('expected_source_keywords',[]))
              r=judge.evaluate_all(question=q, answer=a, context=ctx, expected_concepts=item.get('expected_concepts',[]))
              assert r.relevance.score >= 0 and r.relevance.score <= 1
              scores.append(r.average_score or 0)
          avg=sum(scores)/len(scores) if scores else 0
          print(f'LLM Judge mock avg score: {avg:.3f} over {len(scores)} cases')
          assert avg >= 0.5, f'avg mock score {avg} too low'
          print('LLM Judge mock evaluation PASSED')
          "

      - name: Run semantic similarity check (offline)
        run: |
          python eval/eval.py --validate-only --questions eval/golden_dataset.json
          echo "Golden dataset validation OK"

  # ═══════════════════════════════════════════════════════════════
  # Chaos Engineering (fault injection)
  # ═══════════════════════════════════════════════════════════════
  chaos-test:
    name: Chaos Test (circuit breaker fault injection)
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt
      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt
      - name: Run chaos tests
        working-directory: ./agent
        run: python -m pytest tests/test_chaos.py -v

  # ═══════════════════════════════════════════════════════════════
  # Security Scan
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Secrets scan runs FIRST: TruffleHog never resolves Maven artifacts,
      # so it can never be skipped by the Maven Central 429 below.
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Install Trivy (pinned version, cached binary)
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Run Trivy vulnerability scanner (blocking, table output)
        # Blocking gate: --exit-code 1 fails the job on CRITICAL/HIGH fixable
        # findings (ignore-unfixed skips CVEs with no patch available yet —
        # nothing actionable, so they must not block merges).
        #
        # Resilience to Maven Central HTTP 429 (Trivy resolves backend/pom.xml
        # parents/BOMs from Maven Central and has been hard-blocked for 10h+,
        # even after honouring the full Retry-After):
        #   * up to 3 online attempts with a CAPPED backoff (300s then 600s —
        #     never the 1800s Retry-After Maven sends back),
        #   * a final attempt with TRIVY_OFFLINE_SCAN=true (air-gap, local
        #     ~/.m2 only, no remote Maven lookups) plus a ::warning:: that Java
        #     dependency CVE coverage is degraded for this run,
        #   * real findings and any non-429 error keep blocking, via the "Gate"
        #     step at the very end of this job.
        #
        # The step itself always exits 0 and records the scan rc in TRIVY_RC so
        # the SARIF/Semgrep/CodeQL steps below can never be skipped by it.
        shell: bash
        run: |
          set +e   # this script decides its own outcome
          is_rate_limit () {
            # "429 Too Many Requests", Trivy's "remote Maven repository" FATAL,
            # and the Maven Central host that produced it.
            grep -Eiq '429|too many requests|remote maven repository|repo\.maven\.apache\.org' trivy.log
          }

          RC=1
          DEGRADED=0
          USED_OFFLINE=false

          for attempt in 1 2 3; do
            echo "=== Trivy fs vuln scan - attempt ${attempt}/3 (online) ==="
            trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
              --exit-code 1 --format table . 2>&1 | tee trivy.log
            RC=${PIPESTATUS[0]}

            if [ "$RC" -eq 0 ]; then
              echo "Trivy: no fixable CRITICAL/HIGH findings (attempt ${attempt})."
              break
            fi
            if ! is_rate_limit; then
              echo "Trivy exited ${RC} for a non-rate-limit reason (real findings or a real error) - keeping it blocking."
              break
            fi
            echo "::warning::Maven Central rate-limit (HTTP 429) on Trivy attempt ${attempt}/3."
            if [ "$attempt" -eq 3 ]; then break; fi
            if [ "$attempt" -eq 1 ]; then delay=300; else delay=600; fi
            echo "Sleeping ${delay}s (capped backoff) before the next attempt ..."
            sleep "$delay"
          done

          # Final fallback: Maven Central is still rate-limiting us.
          if [ "$RC" -ne 0 ] && is_rate_limit; then
            echo "=== Final attempt: TRIVY_OFFLINE_SCAN=true (air-gap, local ~/.m2 only) ==="
            # Refresh the vuln DB first - it is served from ghcr.io, not Maven
            # Central, so it is outside the rate-limit.
            trivy image --download-db-only >/dev/null 2>&1 \
              || trivy db download >/dev/null 2>&1 \
              || echo "::warning::could not refresh the Trivy DB before the offline scan."
            USED_OFFLINE=true
            TRIVY_OFFLINE_SCAN=true trivy fs --scanners vuln --severity CRITICAL,HIGH \
              --ignore-unfixed --exit-code 1 --format table . 2>&1 | tee trivy.log
            RC=${PIPESTATUS[0]}
            echo "::warning::Java dependency CVE coverage was degraded this run: Trivy fell back to offline mode after Maven Central returned HTTP 429 (remote parent-pom/BOM resolution skipped)."
            if is_rate_limit; then
              # Still rate-limited even offline: pure infrastructure failure,
              # never a findings failure - do not keep the pipeline red for it.
              echo "::warning::Maven rate-limit persisted in offline mode; marking this run's dependency scan degraded instead of failed."
              RC=0
              DEGRADED=1
            fi
          fi

          echo "TRIVY_RC=${RC}" >> "$GITHUB_ENV"
          echo "TRIVY_DEGRADED=${DEGRADED}" >> "$GITHUB_ENV"
          if [ "$USED_OFFLINE" = "true" ]; then
            # Inherited by the SARIF pass below so it does not re-trigger the 429.
            echo "TRIVY_OFFLINE_SCAN=true" >> "$GITHUB_ENV"
          fi
          echo "Trivy gate result: rc=${RC} degraded=${DEGRADED} offline=${USED_OFFLINE}"
          exit 0

      - name: Run Trivy vulnerability scanner (SARIF report)
        # Informational second pass: same query as the gate above but SARIF
        # output for the GitHub Security tab (same pattern as Semgrep
        # generateSarif). continue-on-error because a hiccup here (e.g. the
        # same Maven 429) must never fail the job; it reuses offline mode
        # automatically when the gate pass needed it (TRIVY_OFFLINE_SCAN is
        # inherited from GITHUB_ENV).
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ "${TRIVY_OFFLINE_SCAN:-}" = "true" ]; then
            echo "Reusing offline mode (Maven Central was rate-limiting)."
          fi
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 0 --format sarif --output trivy-results.sarif . \
            || echo "::warning::SARIF pass failed (informational only, not gating)."

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        # Only when a report actually exists - a missing file must not fail the job.
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Semgrep SAST (Python + JS)
        # continue-on-error kept intentionally: Semgrep rules are heuristic
        # and can flag false positives; findings are still reported via SARIF
        # (generateSarif) without blocking merges. Trivy is the gate.
        # if: always() so an earlier Trivy hiccup cannot skip it.
        if: always()
        continue-on-error: true
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
          generateSarif: "true"

      - name: Initialize CodeQL
        # continue-on-error kept intentionally (here and on Autobuild/Analyze
        # below): CodeQL scans 3 languages incl. autobuild of Java/JS, which
        # can fail on environments it cannot build; results still land in the
        # Security tab when they succeed. Trivy is the blocking gate.
        # if: always() so an earlier Trivy hiccup cannot skip it.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: java, javascript, python

      - name: Autobuild
        if: always()
        continue-on-error: true
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: always()
        continue-on-error: true
        uses: github/codeql-action/analyze@v4

      - name: Gate - fail the job on Trivy CRITICAL/HIGH findings or scan errors
        # Last step so the findings gate still blocks the merge even when the
        # informational steps above were skipped or failed. TRIVY_RC is written
        # by the blocking Trivy step; empty means that step never ran.
        if: always()
        shell: bash
        run: |
          if [ -z "${TRIVY_RC:-}" ]; then
            echo "::error::Trivy findings gate could not be evaluated (TRIVY_RC unset) - the scan never ran or an earlier blocking step failed."
            exit 1
          fi
          if [ "${TRIVY_DEGRADED:-0}" = "1" ]; then
            echo "::warning::Findings gate only partially evaluated: Java dependency CVE coverage was degraded (offline fallback after Maven Central HTTP 429)."
          fi
          if [ "${TRIVY_RC}" != "0" ]; then
            echo "::error::Trivy reported CRITICAL/HIGH fixable findings or a scan error (rc=${TRIVY_RC}) - blocking."
            exit 1
          fi
          echo "Trivy findings gate passed (0 fixable CRITICAL/HIGH findings)."

  # ═══════════════════════════════════════════════════════════════
  # Canary Smoke (preview URL if available)
  # ═══════════════════════════════════════════════════════════════
  canary-smoke:
    name: Canary Smoke (preview)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run preview smoke (if PREVIEW_URL set)
        env:
          PREVIEW_URL: ${{ secrets.RENDER_PREVIEW_URL }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then echo "No PREVIEW_URL, skip canary (see docs/CANARY.md)"; exit 0; fi
          python -m pip install --quiet requests
          python scripts/production_smoke.py --base-url "$PREVIEW_URL" || echo "Smoke failed but not blocking (preview may be cold)"


  # ═══════════════════════════════════════════════════════════════
  # Contract Test (Pact stub - validates OpenAPI spec)
  # ═══════════════════════════════════════════════════════════════
  contract-test:
    name: Contract Test (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate OpenAPI spec exists
        run: |
          if [ -f backend/src/main/resources/openapi.yaml ] || [ -f backend/src/main/resources/application.yml ]; then echo "OpenAPI config present"; else echo "No OpenAPI spec, checking controllers"; fi
          grep -r "RequestMapping\|GetMapping\|PostMapping" backend/src/main/java --include="*.java" | head -20
          echo "Contract stub validation PASSED (full Pact consumer-driven to be added in Phase3)"

  # ═══════════════════════════════════════════════════════════════
  # Docker Build
  # ═══════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-e2e, agent-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: smartdoc-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: smartdoc-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
