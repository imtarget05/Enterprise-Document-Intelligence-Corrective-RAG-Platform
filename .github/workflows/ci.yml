name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Backend Tests
  # ═══════════════════════════════════════════════════════════════
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smartdoc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartdoc_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS10ZXN0aW5nLTIwMjQ=
          INTERNAL_SERVICE_TOKEN: test-internal-token
          MAVEN_OPTS: --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
        run: mvn clean verify -B

      - name: Check backend coverage threshold
        working-directory: ./backend
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "⚠️ No JaCoCo report found"
            exit 0
          fi
          # The jacoco-maven-plugin `check` goal already gates BUNDLE line
          # coverage at 65% during `mvn verify`; this surfaces the number in
          # the CI log as well.
          python3 -c 'import sys, xml.etree.ElementTree as ET; r = ET.parse("target/site/jacoco/jacoco.xml").getroot(); c = [x for x in r.findall("counter") if x.get("type") == "LINE"][0]; m, k = int(c.get("missed")), int(c.get("covered")); t = m + k; p = k / t if t else 0; print(f"Line coverage: {p:.2%} ({k}/{t})"); sys.exit(0 if p >= 0.65 else 1)'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ═══════════════════════════════════════════════════════════════
  # Frontend Tests
  # ═══════════════════════════════════════════════════════════════
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        # `npm test` runs `vitest run` WITHOUT coverage; `test:coverage` is the
        # script that collects coverage AND enforces vite.config.ts thresholds.
        # Use it explicitly — otherwise no lcov.info is produced and this job
        # would report a green build with zero coverage enforcement.
        run: npm run test:coverage

      - name: Check frontend coverage threshold
        working-directory: ./frontend
        run: |
          # Vitest enforces the coverage thresholds (lines/statements 80,
          # branches 70, functions 65) at test time, so a shortfall already
          # failed the previous step. Here we surface the number — but a
          # missing report means coverage never ran, which must fail loudly
          # rather than silently passing.
          if [ ! -f coverage/lcov.info ]; then
            echo "ERROR: coverage/lcov.info was not produced — coverage did not run."
            exit 1
          fi
          python3 - <<'PYEOF'
          import sys
          lh = lf = 0
          with open("coverage/lcov.info") as f:
              for line in f:
                  if line.startswith("LH:"):
                      lh += int(line[3:])
                  elif line.startswith("LF:"):
                      lf += int(line[3:])
          pct = (lh / lf * 100) if lf else 0.0
          print(f"Line coverage: {pct:.2f}% ({lh}/{lf})")
          PYEOF

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/

  # ════════════════════════════════════════════════════════════════
  # Frontend E2E Tests (Playwright)
  # ════════════════════════════════════════════════════════════════
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run hermetic E2E tests (chat-ui)
        working-directory: ./frontend
        run: npx playwright test e2e/chat-ui.spec.ts --project=chromium

      - name: Run fullstack E2E tests (opt-in)
        if: env.E2E_API_URL != ''
        working-directory: ./frontend
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: npx playwright test e2e/fullstack-smoke.spec.ts e2e/chat-flow.spec.ts e2e/documents.spec.ts e2e/admin-ui.spec.ts --project=chromium

  # ════════════════════════════════════════════════════════════════
  # Agent Tests
  # ════════════════════════════════════════════════════════════════
  agent-test:
    name: Agent Tests
    runs-on: ubuntu-latest
    env:
      # The agent Settings model treats an unset APP_ENV as "production" and
      # then enforces strict secrets (INTERNAL_SERVICE_TOKEN / POSTGRES_PASSWORD
      # / AGENT_ALLOWED_ORIGINS). These unit tests don't need real creds, so run
      # them in the permissive "local" mode. Credentials are validated at deploy
      # time in production where the real secrets are injected.
      APP_ENV: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run agent tests
        working-directory: ./agent
        run: python -m pytest tests/ -q

  # ═══════════════════════════════════════════════════════════════
  # Offline Eval Grader Tests (zero network / zero LLM)
  # ═══════════════════════════════════════════════════════════════
  eval-grader:
    name: Eval Grader Tests (offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline grader tests
        run: |
          # eval/eval.py (unit under test) imports `requests` at module load.
          python -m pip install --quiet pytest requests
          python -m pytest eval/tests/test_grader.py -q

  # ═══════════════════════════════════════════════════════════════
  # LLM Judge Mock Evaluation (deterministic, no LLM API)
  # ═══════════════════════════════════════════════════════════════
  eval-llm-judge-mock:
    name: LLM Judge Mock (golden 50)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install judge dependencies
        run: python -m pip install --quiet requests pytest

      - name: Validate golden dataset size
        run: |
          python -c "import json; d=json.load(open('eval/golden_dataset.json')); assert len(d)>=50, f'golden_dataset.json has {len(d)} <50 entries'; print(f'Golden dataset: {len(d)} entries OK')"

      - name: Run LLM judge mock evaluation
        run: |
          python -c "
          import json
          from eval.llm_judge import LLMJudge
          golden=json.load(open('eval/golden_dataset.json'))
          judge=LLMJudge(mock=True)
          scores=[]
          for item in golden:
              q=item['question']; a=item['golden_answer']; ctx=' '.join(item.get('expected_source_keywords',[]))
              r=judge.evaluate_all(question=q, answer=a, context=ctx, expected_concepts=item.get('expected_concepts',[]))
              assert r.relevance.score >= 0 and r.relevance.score <= 1
              scores.append(r.average_score or 0)
          avg=sum(scores)/len(scores) if scores else 0
          print(f'LLM Judge mock avg score: {avg:.3f} over {len(scores)} cases')
          assert avg >= 0.5, f'avg mock score {avg} too low'
          print('LLM Judge mock evaluation PASSED')
          "

      - name: Run semantic similarity check (offline)
        run: |
          python eval/eval.py --validate-only --questions eval/golden_dataset.json
          echo "Golden dataset validation OK"

  # ═══════════════════════════════════════════════════════════════
  # Chaos Engineering (fault injection)
  # ═══════════════════════════════════════════════════════════════
  chaos-test:
    name: Chaos Test (circuit breaker fault injection)
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt
      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt
      - name: Run chaos tests
        working-directory: ./agent
        run: python -m pytest tests/test_chaos.py -v

  # ═══════════════════════════════════════════════════════════════
  # Security Scan
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (blocking, table output)
        # Blocking scan: exit-code 1 fails the job on CRITICAL/HIGH findings
        # (ignore-unfixed skips CVEs with no patch available yet — nothing
        # actionable, so they must not block merges). No continue-on-error:
        # if Trivy flakes (e.g. Maven Central 429), the failure is visible
        # and the job can be re-run instead of silently passing.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

      - name: Run Trivy vulnerability scanner (SARIF report)
        # Non-blocking second pass that only produces the SARIF report for
        # the GitHub Security tab (same pattern as Semgrep generateSarif
        # below); the table pass above is the one that gates the merge.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Semgrep SAST (Python + JS)
        # continue-on-error kept intentionally: Semgrep rules are heuristic
        # and can flag false positives; findings are still reported via SARIF
        # (generateSarif) without blocking merges. Trivy is the gate.
        continue-on-error: true
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
          generateSarif: "true"

      - name: Initialize CodeQL
        # continue-on-error kept intentionally (here and on Autobuild/Analyze
        # below): CodeQL scans 3 languages incl. autobuild of Java/JS, which
        # can fail on environments it cannot build; results still land in the
        # Security tab when they succeed. Trivy is the blocking gate.
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: java, javascript, python

      - name: Autobuild
        continue-on-error: true
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@v4

  # ═══════════════════════════════════════════════════════════════
  # Canary Smoke (preview URL if available)
  # ═══════════════════════════════════════════════════════════════
  canary-smoke:
    name: Canary Smoke (preview)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run preview smoke (if PREVIEW_URL set)
        env:
          PREVIEW_URL: ${{ secrets.RENDER_PREVIEW_URL }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then echo "No PREVIEW_URL, skip canary (see docs/CANARY.md)"; exit 0; fi
          python -m pip install --quiet requests
          python scripts/production_smoke.py --base-url "$PREVIEW_URL" || echo "Smoke failed but not blocking (preview may be cold)"


  # ═══════════════════════════════════════════════════════════════
  # Contract Test (Pact stub - validates OpenAPI spec)
  # ═══════════════════════════════════════════════════════════════
  contract-test:
    name: Contract Test (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate OpenAPI spec exists
        run: |
          if [ -f backend/src/main/resources/openapi.yaml ] || [ -f backend/src/main/resources/application.yml ]; then echo "OpenAPI config present"; else echo "No OpenAPI spec, checking controllers"; fi
          grep -r "RequestMapping\|GetMapping\|PostMapping" backend/src/main/java --include="*.java" | head -20
          echo "Contract stub validation PASSED (full Pact consumer-driven to be added in Phase3)"

  # ═══════════════════════════════════════════════════════════════
  # Docker Build
  # ═══════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-e2e, agent-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: smartdoc-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: smartdoc-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════
  # Deploy (only on main branch)
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-e2e, agent-test, security-scan, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      # Mirror secrets into job env so they can be used in `if:` conditions
      # (the `secrets` context is not allowed there).
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.GHCR_USERNAME != '' && env.GHCR_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: ${{ secrets.GHCR_TOKEN != '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartdoc-backend:latest
            ghcr.io/${{ github.repository_owner }}/smartdoc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: ${{ secrets.GHCR_TOKEN != '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartdoc-frontend:latest
            ghcr.io/${{ github.repository_owner }}/smartdoc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Require real Render deployment credentials
        # CI green is NOT evidence of a live deployment. Without these secrets
        # nothing can be redeployed, so this job must fail loudly instead of
        # skipping while still reporting success (audit: deploy illusion).
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY / RENDER_SERVICE_ID secrets are not configured. Production redeploy cannot run — add both (Render dashboard -> smart-doc-backend service: API key + Service ID) or remove this deploy job deliberately."
            exit 1
          fi
          echo "Render credentials present — proceeding with backend redeploy."

      - name: Deploy backend to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Wait for backend readiness (/api/actuator/health)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          HOST=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            | jq -r '.serviceDetails.url // empty')
          if [ -z "$HOST" ]; then
            echo "::error::Could not resolve service URL from Render API"
            exit 1
          fi
          echo "Polling ${HOST}/api/actuator/health (Spring cold start up to ~5 min)..."
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 "${HOST}/api/actuator/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Backend healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "Attempt $i/20 — HTTP $CODE"
            sleep 15
          done
          echo "::error::Backend /api/actuator/health did not return 200 within 5 minutes of deploy"
          exit 1

      - name: Report deployment outcome
        run: |
          echo "Deployment pipeline finished with a verified backend readiness probe."
          echo "Images: backend + frontend built for GHCR/Render/Cloudflare consumers."
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "GHCR images pushed."
          else
            echo "GHCR images built locally only (no registry credentials)."
          fi