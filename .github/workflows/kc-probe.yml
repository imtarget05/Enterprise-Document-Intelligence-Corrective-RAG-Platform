name: KC probe (temp)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render keycloak service state
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          export KC=srv-dbra675g1s2s73ft1150
          python3 <<'PY'
          import json, os, urllib.request
          def render(path):
              req = urllib.request.Request(f"https://api.render.com/v1/{path}", method="GET",
                  headers={"Authorization": "Bearer " + os.environ["RENDER_API_KEY"]})
              return json.load(urllib.request.urlopen(req, timeout=30))
          svc = render("services/" + os.environ["KC"])
          sd = svc.get("serviceDetails") or {}
          print("state:", sd.get("state") or svc.get("state"))
          print("suspended:", svc.get("suspended"), "| autoDeploy:", svc.get("autoDeploy"))
          print("buildFilter:", sd.get("buildFilter"))
          for x in render("services/" + os.environ["KC"] + "/deploys?limit=3"):
              y = x.get("deploy", x)
              print("deploy:", y.get("id","")[:12], y.get("status"), y.get("createdAt"))
          PY
          echo "== probe from runner =="
          curl -s --max-time 60 -o /dev/null -w "realm smartdoc: %{http_code} in %{time_total}s\n" "https://smartdoc-keycloak.onrender.com/realms/smartdoc" || echo "curl exit $?"
