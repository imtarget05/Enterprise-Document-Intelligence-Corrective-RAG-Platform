name: KC probe (temp)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fix backend autodeploy + report
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          export BID=srv-db1ul5ij9qps73do0pq0
          python3 <<'PY'
          import json, os, urllib.request
          def render(path, method="GET", body=None):
              req = urllib.request.Request(f"https://api.render.com/v1/{path}", method=method,
                  headers={"Authorization": "Bearer " + os.environ["RENDER_API_KEY"], "Content-Type": "application/json"},
                  data=json.dumps(body).encode() if body else None)
              return json.load(urllib.request.urlopen(req, timeout=30))
          BID = os.environ["BID"]
          render("services/" + BID, method="PATCH", body={"autoDeploy": "no"})
          print("backend autodeploy -> no")
          deps = render(f"services/{BID}/deploys?limit=3")
          for x in deps:
              y = x.get("deploy", x)
              print("deploy:", y.get("id","")[:12], y.get("status"), y.get("createdAt"))
              did = y.get("id")
              if y.get("status") in ("build_failed", "update_failed", "deploy_failed"):
                  d = render(f"services/{BID}/deploys/{did}")
                  for m in d.get("deploy", d).get("messages", [])[:6]:
                      print("  msg:", str(m)[:200])
          PY
          curl -s --max-time 45 -o /dev/null -w "backend health: %{http_code}\n" "https://smartdoc-backend-2hhz.onrender.com/api/actuator/health" || echo "curl exit $?"
