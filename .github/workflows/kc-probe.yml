name: KC probe (temp)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure keycloak neon postgres + watch deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          KC_DB_PASSWORD: ${{ secrets.NEON_KC_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export KC=srv-dbra675g1s2s73ft1150
          python3 <<'PY'
          import json, os, time, urllib.request
          def render(path, method="GET", body=None):
              req = urllib.request.Request(f"https://api.render.com/v1/{path}", method=method,
                  headers={"Authorization": "Bearer " + os.environ["RENDER_API_KEY"], "Content-Type": "application/json"},
                  data=json.dumps(body).encode() if body else None)
              return json.load(urllib.request.urlopen(req, timeout=30))
          KC = os.environ["KC"]
          resp = json.load(urllib.request.urlopen(urllib.request.Request(
              f"https://api.render.com/v1/services/{KC}/env-vars", method="GET",
              headers={"Authorization": "Bearer " + os.environ["RENDER_API_KEY"]}), timeout=30))
          vars_ = []
          for item in resp:
              ev = item.get("envVar", item) if isinstance(item, dict) else {}
              if isinstance(ev, dict) and ev.get("key"):
                  vars_.append({"key": ev["key"], "value": ev.get("value"), "sync": ev.get("sync")})
          have = {v["key"]: v for v in vars_}
          print("existing keys:", len(vars_), "| KC_DB:", have.get("KC_DB", {}).get("value"))
          newvals = {
              "KC_DB": "postgres",
              "KC_DB_URL": "jdbc:postgresql://ep-rough-paper-beefdl2s.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require",
              "KC_DB_USERNAME": "neondb_owner",
              "KC_DB_PASSWORD": os.environ["KC_DB_PASSWORD"],
          }
          changed = False
          for k, v in newvals.items():
              if have.get(k, {}).get("value") != v:
                  if k in have:
                      have[k]["value"] = v
                  else:
                      vars_.append({"key": k, "value": v})
                  changed = True
          if changed:
              r = urllib.request.Request(f"https://api.render.com/v1/services/{KC}/env-vars", method="PUT",
                  headers={"Authorization": "Bearer " + os.environ["RENDER_API_KEY"], "Content-Type": "application/json"},
                  data=json.dumps(vars_).encode())
              print("env vars put ->", urllib.request.urlopen(r, timeout=30).status)
              # env change with autodeploy=no needs an explicit deploy
              render(f"services/{KC}/deploys", method="POST", body={"clearCache": "do_not_clear"})
              print("manual deploy triggered")
          else:
              print("env unchanged — trigger deploy anyway to apply pending vars")
              render(f"services/{KC}/deploys", method="POST", body={"clearCache": "do_not_clear"})
              print("manual deploy triggered")
          # watch latest deploy until terminal
          target = None
          for i in range(40):
              deps = render(f"services/{KC}/deploys?limit=2")
              statuses = [(y.get("deploy", y).get("id","")[:12], y.get("deploy", y).get("status")) for y in deps]
              print("deploys:", statuses)
              did, st = statuses[0]
              if st in ("build_failed", "deploy_failed", "update_failed", "canceled"):
                  print("FAILED deploy detected:", did)
                  raise SystemExit(1)
              if st == "live":
                  target = did
                  break
              time.sleep(15)
          print("latest live deploy:", target)
          PY
          echo "== probe =="
          curl -s --max-time 30 -o /dev/null -w "realm master: %{http_code}\n" "https://smartdoc-keycloak.onrender.com/realms/master" || echo "curl exit $?"
