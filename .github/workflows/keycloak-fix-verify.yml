name: Keycloak fix/verify (temp)
on: workflow_dispatch
jobs:
  fix-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Render — patch dockerfilePath, deploy, poll health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          SERVICES=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=100")
          SVC=$(echo "$SERVICES" | python3 -c 'import json,sys; ss=json.load(sys.stdin); m=[s["service"] for s in ss if s["service"]["name"]=="smartdoc-keycloak"]; print(json.dumps(m[0]) if m else "")')
          [ -n "$SVC" ] || { echo "::error::smartdoc-keycloak not found"; exit 1; }
          SID=$(echo "$SVC" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "service id: $SID"
          echo "== current dockerfilePath:"
          echo "$SVC" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["serviceDetails"].get("envSpecificDetails",{}))'
          echo "== patching dockerfilePath"
          cat > /tmp/patch.json <<'EOFJSON'
          {
            "serviceDetails": {
              "envSpecificDetails": {
                "dockerfilePath": "docker/Dockerfile.keycloak",
                "dockerContext": "."
              }
            }
          }
          EOFJSON
          RESP=$(curl -s -X PATCH -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" --data-binary @/tmp/patch.json "https://api.render.com/v1/services/$SID")
          echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("after patch:", d["serviceDetails"].get("envSpecificDetails",{}))'
          echo "== triggering deploy"
          DEPLOY=$(curl -s -o /tmp/dep.json -w "%{http_code}" -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d '{"clearCache":"do_not_clear"}' "https://api.render.com/v1/services/$SID/deploys")
          echo "deploy trigger http: $DEPLOY"
          DID=""
          if [ "$DEPLOY" = "201" ]; then
            DID=$(python3 -c 'import json; d=json.load(open("/tmp/dep.json")); print(d.get("id") or d.get("deployId",""))')
          fi
          if [ -z "$DID" ]; then
            echo "falling back to latest deploy"
            DID=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SID/deploys?limit=1" | python3 -c 'import json,sys; ds=json.load(sys.stdin); print(ds[0]["deploy"]["id"] if ds else "")')
          fi
          echo "deploy id: $DID"
          ST=""
          for i in $(seq 1 80); do
            sleep 15
            ST=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SID/deploys/$DID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            echo "deploy attempt $i: $ST"
            case "$ST" in live) break ;; deploy_failed|build_failed|canceled) echo "::error::deploy $ST"; exit 1 ;; esac
          done
          [ "$ST" = "live" ] || { echo "::error::deploy did not go live (last: $ST)"; exit 1; }
          echo "== polling health endpoint"
          CODE=000
          for i in $(seq 1 40); do
            sleep 10
            CODE=$(curl -s -o /tmp/kc.txt -w "%{http_code}" --max-time 10 "https://smartdoc-keycloak.onrender.com/realms/master" || true)
            echo "health attempt $i: /realms/master -> $CODE"
            [ "$CODE" = "200" ] && break
          done
          [ "$CODE" = "200" ] || { echo "::error::keycloak health failed"; head -c 400 /tmp/kc.txt; exit 1; }
          echo "KEYCLOAK HEALTHY — https://smartdoc-keycloak.onrender.com/realms/master"
