name: Keycloak fix/verify (temp)
on: workflow_dispatch
jobs:
  fix-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Render — create smartdoc-keycloak if missing, deploy, poll health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          KC_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          SERVICES=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=100")
          SVC=$(echo "$SERVICES" | python3 -c 'import json,sys; ss=json.load(sys.stdin); m=[s["service"] for s in ss if s["service"]["name"]=="smartdoc-keycloak"]; print(json.dumps(m[0]) if m else "")')
          if [ -z "$SVC" ]; then
            echo "== creating smartdoc-keycloak service"
            CREATE=$(KC_ADMIN_PASSWORD="$KC_ADMIN_PASSWORD" python3 -c "import json,os; print(json.dumps({'type':'web','name':'smartdoc-keycloak','plan':'free','repo':'https://github.com/imtarget05/Enterprise-Document-Intelligence-Corrective-RAG-Platform','branch':'main','autoDeploy':True,'dockerfilePath':'docker/Dockerfile.keycloak','healthCheckPath':'/realms/master','envVars':[{'key':'KEYCLOAK_ADMIN','value':'admin'},{'key':'KEYCLOAK_ADMIN_PASSWORD','value':os.environ['KC_ADMIN_PASSWORD']},{'key':'KC_HOSTNAME','value':'https://smartdoc-keycloak.onrender.com'},{'key':'KC_PROXY','value':'edge'}]}))")
            RESP=$(curl -s -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d "$CREATE" "https://api.render.com/v1/services")
            SVC=$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d) if "id" not in d else json.dumps({"id": d["id"], "name": d["name"], "serviceDetails": {"url": d["serviceDetails"]["url"]}}))')
            echo "$SVC" | head -c 600
          fi
          SID=$(echo "$SVC" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "service id: $SID"
          ST="created"
          for i in $(seq 1 80); do
            sleep 15
            ST=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SID" | python3 -c 'import json,sys; d=json.load(sys.stdin); ss=d.get("serviceDetails",{}).get("build",{}).get("status","building"); print(ss or "building")' 2>/dev/null || echo "polling")
            echo "attempt $i: $ST"
            case "$ST" in live) break ;; failed|canceled) echo "::error::build $ST"; exit 1 ;; esac
          done
          [ "$ST" = "live" ] || { echo "::error::service not live (last: $ST)"; exit 1; }
          echo "== polling health endpoint"
          CODE=000
          for i in $(seq 1 40); do
            sleep 10
            CODE=$(curl -s -o /tmp/kc.txt -w "%{http_code}" --max-time 10 "https://smartdoc-keycloak.onrender.com/realms/master" || true)
            echo "attempt $i: /realms/master -> $CODE"
            [ "$CODE" = "200" ] && break
          done
          [ "$CODE" = "200" ] || { echo "::error::keycloak health failed"; head -c 400 /tmp/kc.txt; exit 1; }
          echo "KEYCLOAK HEALTHY — https://smartdoc-keycloak.onrender.com/realms/master"
