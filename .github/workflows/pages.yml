name: Deploy Frontend to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          # Single source: repo variable SMARTDOC_API_URL (fallback = current
          # canonical backend). Mirrors cd.yml GHCR frontend build-arg so the
          # Pages deploy and the container image can never drift apart.
          VITE_API_URL: ${{ vars.SMARTDOC_API_URL || 'https://smartdoc-backend-2hhz.onrender.com/api' }}
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler pages project create "${{ vars.CLOUDFLARE_PAGES_PROJECT || 'smart-doc-chatbot' }}" --production-branch main || true
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: "pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'smart-doc-chatbot' }} --branch=main"
