spring:
  application:
    name: smart-doc-chatbot
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/smart_doc_chatbot}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  # Render injects $PORT (not SERVER_PORT). The container must listen on it,
  # otherwise the platform health check on $PORT never reaches Spring and the
  # service is routed as "no-server".
  port: ${SERVER_PORT:${PORT:8080}}
  servlet:
    context-path: /api
  shutdown: graceful
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:smartdoc}
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

jwt:
  # DEV-ONLY fallback so local development works without configuration.
  # Staging/production MUST override this via JWT_SECRET (openssl rand -base64 48);
  # SecretStrengthValidator fails startup if the committed default is still in use.
  secret: ${JWT_SECRET:c21hcnQtZG9jLWNoYXRib3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtMjAyNg==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Security guards for the classic chat path.
security:
  prompt-injection:
    # Heuristic prompt-injection detection on user messages; HIGH-severity
    # requests are rejected before any LLM call.
    enabled: ${PROMPT_INJECTION_ENABLED:true}
  # Token for internal endpoints (actuator metrics). Empty = requests rejected.
  internal-token: ${INTERNAL_SERVICE_TOKEN:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8080,http://127.0.0.1:3000}

llm:
  base-url: ${LLM_BASE_URL:http://localhost:8001}
  chat-model: ${LLM_CHAT_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}
  embedding-model: ${LLM_EMBEDDING_MODEL:@cf/baai/bge-base-en-v1.5}
  temperature: ${LLM_TEMPERATURE:0.3}
  top-p: ${LLM_TOP_P:0.95}
  max-attempts: ${LLM_MAX_ATTEMPTS:3}
  retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:250}

cost:
  per-1k-tokens: ${COST_PER_1K_TOKENS:{}}

# Document ingestion (chunking) — size in tokens (~4 chars/token), overlap
# carries the tail of one chunk into the next so boundary sentences keep
# context during retrieval.
ingestion:
  chunk-size: ${INGESTION_CHUNK_SIZE:500}
  chunk-overlap: ${INGESTION_CHUNK_OVERLAP:100}

# Corrective RAG (CRAG) — confidence evaluation + query reformulation +
# web-search fallback for the classic /chat/ask & /chat/ask-stream endpoints.
crag:
  # Chunks with max score below this trigger query reformulation / fallback.
  confidence-threshold: ${CRAG_CONFIDENCE_THRESHOLD:0.6}
  # Number of top chunks kept at each retrieval stage.
  top-k: ${CRAG_TOP_K:3}
  # Number of alternative reformulations to try on low confidence.
  max-reformulations: ${CRAG_MAX_REFORMULATIONS:2}
  # Allow automatic web-search fallback on low confidence (independent of the
  # per-request `webSearch` flag). Requires Tavily to be configured.
  web-search-enabled: ${CRAG_WEB_SEARCH_ENABLED:false}
  # Safe abstention: when no sufficient evidence exists and no web fallback is
  # available, return "insufficient evidence" instead of answering from general
  # knowledge (unanswerable-question handling).
  abstain-enabled: ${CRAG_ABSTAIN_ENABLED:true}

# Tavily web search (optional). Disabled when api-key is empty.
tavily:
  api-key: ${TAVILY_API_KEY:}
  url: ${TAVILY_URL:https://api.tavily.com/search}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus is guarded by InternalTokenFilter (X-Internal-Token).
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.smartdocchat: ${LOGGING_LEVEL_COM_SMARTDOCCHAT:DEBUG}
  file:
    name: ${LOG_FILE:logs/application.log}
    max-size: 10MB
    max-history: 30

storage:
  provider: ${STORAGE_PROVIDER:local}
  local:
    upload-dir: ${LOCAL_UPLOAD_DIR:uploads}
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET_NAME:smart-doc-documents}
    endpoint: ${R2_ENDPOINT:}
# Circuit breaker around LLM router calls (see LlmClient).
# registerHealthIndicator is off on purpose: an open breaker must not flip
# /actuator/health DOWN and trigger a platform restart — the state is visible
# via resilience4j.circuitbreaker.* metrics on /actuator/prometheus instead.
resilience4j:
  circuitbreaker:
    instances:
      agentService:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 15s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException
          - java.util.concurrent.TimeoutException
      tavilyService:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.lang.RuntimeException
      llmService:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        # Slow-call detection ≈ the RestTemplate read timeout; normal slow
        # completions must not be counted as failures.
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 60s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - com.smartdocchat.service.LlmClient.UnexpectedResponseException
  retry:
    instances:
      tavilyService:
        maxAttempts: 3
        waitDuration: 300ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.lang.RuntimeException
      agentService:
        maxAttempts: 3
        waitDuration: 250ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException

chat:
  sse:
    threads: ${CHAT_SSE_THREADS:0}

# API rate limiting (Redis-backed sliding window, see RateLimitInterceptor).
ratelimit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  chat-per-minute: 30
  upload-per-minute: 10
  auth-per-minute: 10

# Agent — backend -> llm-router agentic path (#4)
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:9000}
  timeout-ms: ${AGENT_TIMEOUT_MS:15000}

# SSO/OIDC — corporate identity federation (Keycloak / Entra ID / Okta).
# Disabled by default; set SSO_OIDC_ENABLED=true plus issuer/credentials to
# activate. First login auto-provisions the user (see CustomOidcUserService)
# and issues the standard app JWT (see OidcLoginSuccessHandler).
sso:
  oidc:
    enabled: ${SSO_OIDC_ENABLED:false}
    issuer-uri: ${SSO_OIDC_ISSUER_URI:}
    client-id: ${SSO_OIDC_CLIENT_ID:}
    client-secret: ${SSO_OIDC_CLIENT_SECRET:}
    post-login-redirect: ${SSO_OIDC_POST_LOGIN_REDIRECT:http://localhost:3000}
    admin-usernames: ${SSO_OIDC_ADMIN_USERNAMES:}

# OAuth2/OIDC alternative configuration (oauth2.* properties).
# Used when OAUTH2_ISSUER_URI is set, providing a simpler setup path
# that doesn't require the full sso.oidc.* configuration.
oauth2:
  client-id: ${OAUTH2_CLIENT_ID:}
  client-secret: ${OAUTH2_CLIENT_SECRET:}
  issuer-uri: ${OAUTH2_ISSUER_URI:}
  redirect-uri: ${OAUTH2_REDIRECT_URI:}
  scopes: ${OAUTH2_SCOPES:openid,profile,email}

google:
  api-key: ${GOOGLE_API_KEY:}
  client-id: ${GOOGLE_CLIENT_ID:${OAUTH2_CLIENT_ID:}}

# Langfuse observability (traces per CRAG request). Opt-in: when
# LANGFUSE_PUBLIC_KEY is empty the tracer is disabled and the app runs
# with zero overhead. Keys MUST come from env / Render dashboard — never
# commit them. LANGFUSE_HOST defaults to the EU cloud; set to a
# self-hosted URL (e.g. http://localhost:3000) for local dev.
langfuse:
  enabled: ${LANGFUSE_ENABLED:true}
  host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  # Propagate the trace id to the FastAPI llm-router so a single request
  # shows both Java and Python spans in one tree.
  router-trace-header: X-Langfuse-Trace-Id
