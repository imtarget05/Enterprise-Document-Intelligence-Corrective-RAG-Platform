# ============================================
# Production Profile Configuration
# Activated with SPRING_PROFILES_ACTIVE=prod
# ============================================

spring:
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      enabled: ${REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

server:
  # Render injects $PORT (not SERVER_PORT) — the base application.yml already
  # resolves ${SERVER_PORT:${PORT:8080}}; this profile must not drop $PORT or
  # the platform health check probes a port Spring never binds ("no-server").
  port: ${SERVER_PORT:${PORT:8080}}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: smartdoc
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

# In production Docker network, agent service is reachable by container name
agent:
  service:
    url: ${AGENT_SERVICE_URL:http://agent:9000}

# Production security headers
security:
  prompt-injection:
    enabled: true
  internal-token: ${INTERNAL_SERVICE_TOKEN:}

# Production rate limits (higher for internal users)
ratelimit:
  enabled: true
  chat-per-minute: 60
  upload-per-minute: 20
  auth-per-minute: 20

# Production CRAG settings
crag:
  confidence-threshold: 0.6
  top-k: 5
  max-reformulations: 3
  web-search-enabled: false
  abstain-enabled: true

logging:
  level:
    root: WARN
    com.smartdocchat: INFO
    org.springframework: WARN
    org.hibernate: WARN

management:
  health:
    redis:
      enabled: false
