# ============================================
# Smart Document Chatbot - Production Docker Compose
# Usage: docker compose -f docker/docker-compose.yml up -d
#
# Data storage (all free-tier, long-term):
#   PostgreSQL  → Neon serverless  (set NEON_DATABASE_URL in .env)
#   Vector DB   → Qdrant Cloud     (set QDRANT_HOST / QDRANT_API_KEY / QDRANT_USE_HTTPS)
#   File uploads→ Cloudflare R2    (set R2_* keys in .env)
# ============================================

services:

  # --- LLM Router (Cloudflare Workers AI) ---
  llm-router:
    build:
      context: ../llm-router
      dockerfile: Dockerfile
    image: smart-doc-llm-router:latest
    container_name: smart-document-chatbox-llm-router
    restart: unless-stopped
    env_file:
      # Optional: lets `docker compose config` be validated from a clean clone
      # without real credentials. The file is still loaded when it exists, so
      # normal setup (`cp .env.example .env`) is unchanged.
      - path: ../.env
        required: false
    environment:
      ROUTER_CONFIDENCE_THRESHOLD: ${ROUTER_CONFIDENCE_THRESHOLD:-0.7}
      # Cloudflare Workers AI (primary provider with circuit breaker)
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_CHAT_MODEL: ${CLOUDFLARE_CHAT_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      CLOUDFLARE_EMBED_MODEL: ${CLOUDFLARE_EMBED_MODEL:-@cf/baai/bge-base-en-v1.5}
      CLOUDFLARE_TIMEOUT_SECONDS: ${CLOUDFLARE_TIMEOUT_SECONDS:-60}
    ports:
      - "${LLM_ROUTER_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      app-network:
        aliases:
          - llm-router
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Smart Document API (Spring Boot Backend) ---
  smart-document:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: smart-document:latest
    container_name: smart-document-chatbox-backend
    restart: unless-stopped
    env_file:
      # Optional: lets `docker compose config` be validated from a clean clone
      # without real credentials. The file is still loaded when it exists, so
      # normal setup (`cp .env.example .env`) is unchanged.
      - path: ../.env
        required: false
    environment:
      # Database — Neon Serverless PostgreSQL (free 512MB)
      # pgjdbc does NOT parse user:password@ in JDBC URLs; NEON_JDBC_URL is a
      # derived jdbc URL with credentials in query params (see eval/derive_env.py).
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      # Qdrant Cloud (free 1GB)
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_USE_HTTPS: ${QDRANT_USE_HTTPS:-false}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # Cloudflare R2 Storage (free 10GB, S3-compatible)
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-smart-doc-documents}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      # Legacy Supabase Storage
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-documents}
      # CRAG uses the Ollama-compatible router for chat and embeddings.
      LLM_BASE_URL: http://llm-router:8000
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-@cf/baai/bge-base-en-v1.5}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      # JVM
      JAVA_OPTS: "${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}"
      # Spring profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # Secrets MUST be provided in .env (openssl rand -base64 48). There is no
      # committed fallback: a blank JWT_SECRET fails startup (fail-fast), and the
      # committed dev-only secret is rejected in staging/production.
      JWT_SECRET: ${JWT_SECRET:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent:9000}
      EXTERNAL_READ_TIMEOUT_MS: ${EXTERNAL_READ_TIMEOUT_MS:-180000}
      # Logging
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_SMARTDOCCHAT: ${LOGGING_LEVEL_COM_SMARTDOCCHAT:-DEBUG}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      llm-router:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - backend
          - smart-document
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'

  # --- React Frontend (Nginx) ---
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: smart-document-chatbox-frontend
    restart: unless-stopped
    env_file:
      # Optional: lets `docker compose config` be validated from a clean clone
      # without real credentials. The file is still loaded when it exists, so
      # normal setup (`cp .env.example .env`) is unchanged.
      - path: ../.env
        required: false
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      smart-document:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # --- Prometheus (Monitoring) ---
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: smart-document-chatbox-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - app-network
    depends_on:
      smart-document:
        condition: service_healthy

  # --- Grafana (Dashboard) ---
  grafana:
    image: grafana/grafana:10.2.0
    container_name: smart-document-chatbox-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - app-network
    depends_on:
      - prometheus

  # --- AI Agent Automation Service (LangGraph multi-agent orchestration) ---
  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    image: smart-doc-agent:latest
    container_name: smart-document-chatbox-agent
    restart: unless-stopped
    env_file:
      # Optional: lets `docker compose config` be validated from a clean clone
      # without real credentials. The file is still loaded when it exists, so
      # normal setup (`cp .env.example .env`) is unchanged.
      - path: ../.env
        required: false
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LLM_BASE_URL: http://llm-router:8000
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-@cf/baai/bge-base-en-v1.5}
      # Qdrant Cloud
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_USE_HTTPS: ${QDRANT_USE_HTTPS:-false}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # Neon PostgreSQL (agent uses direct psycopg2 connection)
      POSTGRES_HOST: ${NEON_POSTGRES_HOST:-localhost}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-neondb}
      POSTGRES_USER: ${POSTGRES_USER:-neondb_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      NOTION_API_TOKEN: ${NOTION_API_TOKEN:-}
      REPORT_OUTPUT_DIR: /app/reports
    ports:
      - "${AGENT_PORT:-9000}:9000"
    volumes:
      - agent_reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      llm-router:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - agent
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # --- Airflow (batch document ingestion DAG) ---
  airflow-postgres:
    image: postgres:16-alpine
    container_name: smart-document-chatbox-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_DB:-airflow}
      POSTGRES_USER: ${AIRFLOW_USERNAME:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_USERNAME:-airflow}", "-d", "${AIRFLOW_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    image: smart-doc-airflow:latest
    container_name: smart-document-chatbox-airflow
    restart: unless-stopped
    command: >
      bash -c "airflow db migrate && airflow users create
      --username $${AIRFLOW_USERNAME:-airflow} --password $${AIRFLOW_PASSWORD:-airflow}
      --firstname Smart --lastname Doc --role Admin --email admin@example.com
      && airflow webserver"
    env_file:
      # Optional: lets `docker compose config` be validated from a clean clone
      # without real credentials. The file is still loaded when it exists, so
      # normal setup (`cp .env.example .env`) is unchanged.
      - path: ../.env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USERNAME:-airflow}:${AIRFLOW_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Connection + vars the ingestion DAG reads:
      SMARTDOC_BACKEND_URL: http://smart-document:8080
      SMARTDOC_INGEST_OWNER: ${AIRFLOW_INGEST_OWNER:-airflow-bot}
      SMARTDOC_INGEST_USERNAME: ${AIRFLOW_INGEST_USERNAME:-airflow-bot}
      SMARTDOC_INGEST_PASSWORD: ${AIRFLOW_INGEST_PASSWORD:-}
      # Retrain DAG contract: project root + training runner + agent service.
      FINETUNE_ROOT: /opt/smartdoc
      AGENT_BASE_URL: http://agent:9000
      TRAINING_RUNNER_URL: ${TRAINING_RUNNER_URL:-}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_inbound:/opt/airflow/inbound
      - ..:/opt/smartdoc:ro
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      smart-document:
        condition: service_healthy
    networks:
      - app-network

  airflow-scheduler:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    image: smart-doc-airflow:latest
    container_name: smart-document-chatbox-airflow-scheduler
    restart: unless-stopped
    command: airflow scheduler
    env_file:
      # Optional: lets `docker compose config` be validated from a clean clone
      # without real credentials. The file is still loaded when it exists, so
      # normal setup (`cp .env.example .env`) is unchanged.
      - path: ../.env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USERNAME:-airflow}:${AIRFLOW_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      SMARTDOC_BACKEND_URL: http://smart-document:8080
      SMARTDOC_INGEST_OWNER: ${AIRFLOW_INGEST_OWNER:-airflow-bot}
      SMARTDOC_INGEST_USERNAME: ${AIRFLOW_INGEST_USERNAME:-airflow-bot}
      SMARTDOC_INGEST_PASSWORD: ${AIRFLOW_INGEST_PASSWORD:-}
      # Retrain DAG contract: project root + training runner + agent service.
      FINETUNE_ROOT: /opt/smartdoc
      AGENT_BASE_URL: http://agent:9000
      TRAINING_RUNNER_URL: ${TRAINING_RUNNER_URL:-}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_inbound:/opt/airflow/inbound
      - ..:/opt/smartdoc:ro
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
    networks:
      - app-network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  agent_reports:
    driver: local
  airflow_postgres_data:
    driver: local
  airflow_inbound:
    driver: local

networks:
  app-network:
    driver: bridge
