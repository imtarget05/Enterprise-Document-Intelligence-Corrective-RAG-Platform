# Local development docker-compose for eval pipeline (free-tier, in-memory)
# Usage: docker compose -f docker/docker-compose.local.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartdoc-local-postgres
    environment:
      POSTGRES_DB: smartdoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: smartdoc-local-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_local:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: smartdoc-local-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_local:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15

  llm-router:
    build:
      context: ../llm-router
      dockerfile: Dockerfile
    container_name: smartdoc-local-llm-router
    ports:
      - "8001:8001"
    environment:
      - LOCAL_OLLAMA_URL=http://ollama:11434
      - LOCAL_OLLAMA_MODEL=${LOCAL_OLLAMA_MODEL:-qwen2.5:3b}
      - LOCAL_OLLAMA_EMBED_MODEL=${LOCAL_OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - RESPONSE_CACHE_ENABLED=${RESPONSE_CACHE_ENABLED:-true}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - ROUTER_INTERNAL_TOKEN=dev-internal-token-local
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  pgdata_local:
  qdrant_local:
  ollama_local:
