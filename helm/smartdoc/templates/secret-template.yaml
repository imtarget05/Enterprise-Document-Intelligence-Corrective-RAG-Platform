{{- if .Values.secrets.create }}
{{/*
PLACEHOLDER Secret — values below are empty by default and MUST be replaced
by ExternalSecrets (or sealed-secrets / SOPS) in any real cluster.

With ExternalSecrets, set `secrets.create=false` and point
`secrets.existingName` at the Secret your ExternalSecrets sync creates
(default `portfolio-secrets`, matching the raw manifests in k8s/).

If you prefer to template values directly, supply them via values
(secrets.databaseUrl etc.); with `data` encoding the chart would use
`{{ .Values.secrets.databaseUrl | b64enc }}` — with `stringData` (used here)
values stay plaintext, which is the intended form for this placeholder.

NOTE: b64enc / ExternalSecrets are intentionally used OUTSIDE this file in
production; committing real credentials here is forbidden.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smartdoc.secretName" . }}
  labels:
    {{- include "smartdoc.labels" (dict "root" $ "component" "secrets" "role" "secrets") | nindent 4 }}
type: Opaque
stringData:
  # Spring backend datasource
  SMARTDOC_JDBC_URL: {{ .Values.secrets.databaseUrl | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.secrets.datasourceUsername | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.datasourcePassword | quote }}
  # Auth
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SSO_OIDC_ISSUER: {{ .Values.secrets.ssoOidcIssuer | quote }}
  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.secrets.kafkaBootstrapServers | quote }}
  KAFKA_SECURITY_PROTOCOL: {{ .Values.secrets.kafkaSecurityProtocol | quote }}
  {{- if .Values.secrets.kafkaSaslMechanism }}
  KAFKA_SASL_MECHANISM: {{ .Values.secrets.kafkaSaslMechanism | quote }}
  {{- end }}
  {{- if .Values.secrets.kafkaSaslJaasConfig }}
  KAFKA_SASL_JAAS_CONFIG: {{ .Values.secrets.kafkaSaslJaasConfig | quote }}
  {{- end }}
  # Redis (backend + redis + agent share this value)
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  # Agent
  AGENT_DATABASE_URL: {{ .Values.secrets.agentDatabaseUrl | quote }}
  INTERNAL_SERVICE_TOKEN: {{ .Values.secrets.internalServiceToken | quote }}
  # Cloudflare R2 object storage
  R2_ACCOUNT_ID: {{ .Values.secrets.r2AccountId | quote }}
  R2_ACCESS_KEY_ID: {{ .Values.secrets.r2AccessKeyId | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.secrets.r2SecretAccessKey | quote }}
  # Optional overrides
  {{- if .Values.secrets.qdrantUrl }}
  QDRANT_URL: {{ .Values.secrets.qdrantUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.llmProviderApiKey }}
  LLM_PROVIDER_API_KEY: {{ .Values.secrets.llmProviderApiKey | quote }}
  {{- end }}
{{- end }}
