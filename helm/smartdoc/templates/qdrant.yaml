{{- if .Values.qdrant.enabled }}
{{- $root := $ -}}
{{- $ctx := dict "root" $root "component" "qdrant" "role" "vector-db" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smartdoc.componentName" $ctx }}
  labels:
    {{- include "smartdoc.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.qdrant.replicaCount }}
  selector:
    matchLabels:
      {{- include "smartdoc.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smartdoc.selectorLabels" $ctx | nindent 8 }}
    spec:
      securityContext:
        {{- include "smartdoc.podSecurityContext" .Values.qdrant.podSecurityContext | nindent 8 }}
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.qdrant.ports.http }}
            - name: grpc
              containerPort: {{ .Values.qdrant.ports.grpc }}
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          securityContext:
            {{- include "smartdoc.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          {{- include "smartdoc.probes" (dict "root" $root "probes" .Values.qdrant.probes) | nindent 10 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.qdrant.persistence.existingClaim | default (printf "%s-data" (include "smartdoc.componentName" $ctx)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smartdoc.componentName" $ctx }}
  labels:
    {{- include "smartdoc.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "smartdoc.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.qdrant.ports.http }}
      targetPort: http
    - name: grpc
      port: {{ .Values.qdrant.ports.grpc }}
      targetPort: grpc
---
{{- if and .Values.qdrant.persistence.enabled (not .Values.qdrant.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "smartdoc.componentName" $ctx }}-data
  labels:
    {{- include "smartdoc.labels" $ctx | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.qdrant.persistence.accessModes | nindent 4 }}
  {{- with .Values.qdrant.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.qdrant.persistence.size }}
{{- end }}
{{- end }}
