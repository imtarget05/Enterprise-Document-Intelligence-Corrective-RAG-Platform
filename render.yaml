# Spin-down prevention (free tier): each web service below declares its own
# per-service keep-alive flags (keep_alive / auto_stop) — no global kill-switch.
# Keep-alive pings target each service's own healthCheckPath at least every
# 5 minutes so the 4 free services never spin down simultaneously:
#   smart-doc-llm-router -> GET /health/live
#   smart-doc-backend    -> GET /api/actuator/health
#   smart-doc-agent      -> GET /health
#   smartdoc-keycloak    -> GET /realms/master
services:
- type: web
  name: smart-doc-llm-router
  runtime: python
  rootDir: llm-router
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health/live
  keep_alive: true
  auto_stop: false
  autoDeploy: true
  envVars:
  - key: APP_ENV
    value: production
  - key: CLOUDFLARE_ACCOUNT_ID
    sync: false
  - key: CLOUDFLARE_API_TOKEN
    sync: false
  - key: CLOUDFLARE_CHAT_MODEL
    value: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  - key: CLOUDFLARE_EMBED_MODEL
    value: '@cf/baai/bge-base-en-v1.5'
  - key: CLOUDFLARE_TIMEOUT_SECONDS
    value: '60'
  - key: ROUTER_CONFIDENCE_THRESHOLD
    value: '0.7'
  - key: ROUTER_INTERNAL_TOKEN
    sync: false
  - key: REDIS_URL
    sync: false
  - key: LANGFUSE_ENABLED
    value: 'true'
  - key: LANGFUSE_HOST
    value: https://cloud.langfuse.com
  - key: LANGFUSE_PUBLIC_KEY
    sync: false
  - key: LANGFUSE_SECRET_KEY
    sync: false
- type: web
  name: smart-doc-backend
  runtime: docker
  rootDir: .
  plan: free
  dockerfilePath: docker/Dockerfile.backend
  autoDeploy: true
  # Previews for canary (enable in dashboard; free tier supports preview envs)
  # Scaling (paid): uncomment to enable HPA
  # scaling:
  #   minInstances: 2
  #   maxInstances: 5
  #   targetCPUPercent: 70
  healthCheckPath: /api/actuator/health
  keep_alive: true
  auto_stop: false
  envVars:
  - key: SPRING_PROFILES_ACTIVE
    value: prod
  - key: LLM_BASE_URL
    fromService:
      name: smart-doc-llm-router
      type: web
      property: host
  - key: LLM_CHAT_MODEL
    value: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  - key: LLM_EMBEDDING_MODEL
    value: '@cf/baai/bge-base-en-v1.5'
  - key: LLM_TEMPERATURE
    value: '0.3'
  - key: STORAGE_PROVIDER
    value: r2
  - key: R2_ACCOUNT_ID
    sync: false
  - key: R2_ACCESS_KEY_ID
    sync: false
  - key: R2_SECRET_ACCESS_KEY
    sync: false
  - key: R2_BUCKET_NAME
    value: smart-doc-documents
  # DB = Neon Postgres free tier (permanent free, unlike Render free Postgres
  # which expires after 30 days). Set the three SPRING_DATASOURCE_* vars from
  # the Neon dashboard connection string (see docs/DEPLOYMENT.md).
  - key: SPRING_DATASOURCE_URL
    sync: false
  - key: SPRING_DATASOURCE_USERNAME
    sync: false
  - key: SPRING_DATASOURCE_PASSWORD
    sync: false
  # Flyway owns the schema (V1..V17). Hibernate must never mutate it.
  - key: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: validate
  - key: QDRANT_HOST
    sync: false
  - key: QDRANT_PORT
    value: '6333'
  - key: QDRANT_USE_HTTPS
    value: 'true'
  - key: QDRANT_API_KEY
    sync: false
  - key: QDRANT_COLLECTION
    value: documents
  - key: JWT_SECRET
    sync: false
  - key: INTERNAL_SERVICE_TOKEN
    sync: false
  # Must match the real Cloudflare Pages domain (project name is set by
  # CLOUDFLARE_PAGES_PROJECT in .github/workflows/pages.yml). Wildcards cover
  # per-PR preview deployments (random subdomains) — backend now uses
  # setAllowedOriginPatterns, so wildcard patterns are honored.
  - key: CORS_ALLOWED_ORIGINS
    value: https://smart-doc-chatbot.pages.dev,https://*.smart-doc-chatbot.pages.dev
  # Langfuse Cloud (opt-in, zero overhead when keys empty — now ENABLED per contract)
  - key: LANGFUSE_ENABLED
    value: 'true'
  - key: LANGFUSE_HOST
    value: https://cloud.langfuse.com
  - key: LANGFUSE_PUBLIC_KEY
    sync: false
  - key: LANGFUSE_SECRET_KEY
    sync: false
  # Redis for distributed rate limiting (optional, falls back to in-memory).
  # Upstash free tier requires TLS → set REDIS_SSL_ENABLED=true.
  - key: REDIS_HOST
    sync: false
  - key: REDIS_PORT
    value: '6379'
  - key: REDIS_PASSWORD
    sync: false
  - key: REDIS_SSL_ENABLED
    value: 'true'
  # SSO prod (Keycloak/Azure AD/Okta) — disabled until Keycloak public URL ready (local http://localhost:8180 not reachable from Render)
  # Set to 'true' and fill SSO_OIDC_ISSUER_URI with https://smartdoc-keycloak.onrender.com/realms/smartdoc after Keycloak service is healthy
  - key: SSO_OIDC_ENABLED
    value: 'false'
  - key: SSO_OIDC_ISSUER_URI
    sync: false
  - key: SSO_OIDC_CLIENT_ID
    sync: false
  - key: SSO_OIDC_CLIENT_SECRET
    sync: false
  - key: SSO_OIDC_POST_LOGIN_REDIRECT
    value: https://smart-doc-chatbot.pages.dev
  - key: SSO_OIDC_ADMIN_USERNAMES
    sync: false
  # Google OAuth (modern One Tap) — 921957726446-...apps.googleusercontent.com
  - key: GOOGLE_CLIENT_ID
    sync: false
  - key: GOOGLE_CLIENT_SECRET
    sync: false
  - key: GOOGLE_API_KEY
    sync: false
  - key: OAUTH2_CLIENT_ID
    sync: false
  - key: OAUTH2_CLIENT_SECRET
    sync: false
  - key: OAUTH2_ISSUER_URI
    value: https://accounts.google.com
  # Must exactly match an Authorized redirect URI in Google Cloud Console
  - key: OAUTH2_REDIRECT_URI
    value: https://smartdoc-backend-2hhz.onrender.com/api/login/oauth2/code/google
  - key: LOGGING_LEVEL_ROOT
    value: WARN
  - key: LOGGING_LEVEL_COM_SMARTDOCCHAT
    value: INFO
  - key: COST_PER_1K_TOKENS
    value: '{"@cf/meta/llama-3.3-70b-instruct-fp8-fast":0.0003,"@cf/baai/bge-base-en-v1.5":0.0001,"default":0.0003}'
  - key: CHAT_SSE_THREADS
    value: '20'
  # Main chat flow -> agent service (agentic path + HITL approvals).
  # Render routes 443 to the agent's $PORT; no port suffix needed.
  - key: AGENT_BASE_URL
    fromService:
      name: smart-doc-agent
      type: web
      property: host
- type: web
  name: smart-doc-agent
  runtime: python
  rootDir: agent
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  keep_alive: true
  auto_stop: false
  autoDeploy: true
  plan: free
  envVars:
  - key: AGENT_PORT
    value: '9000'
  - key: APP_ENV
    value: production
  - key: INTERNAL_SERVICE_TOKEN
    sync: false
  # HITL approval store on Render: managed Redis (Upstash rediss://... with
  # TLS), set REDIS_URL in the dashboard. Fail-closed so governance never
  # silently degrades when Redis is unreachable.
  - key: REDIS_URL
    sync: false
  - key: HITL_STORE_BACKEND
    value: redis
  - key: HITL_FAIL_CLOSED
    value: 'true'
  - key: HITL_REQUIRE_APPROVAL
    value: 'true'
  # Shared LangGraph checkpoints (Sprint 2: SQLite -> managed Postgres).
  # Set DATABASE_URL in the dashboard to the Render Postgres / Neon connection
  # string; until then checkpoints stay in the agent's local SQLite file, which
  # is single-process and lives on ephemeral disk (a redeploy drops paused
  # runs). NEON_DATABASE_URL is accepted as an alias by the agent.
  - key: DATABASE_URL
    sync: false
  # Fail closed when a shared store IS configured but cannot be opened:
  # silently downgrading to local SQLite would drop paused HITL approvals on
  # the next restart, which is worse than refusing to boot.
  - key: LANGGRAPH_CHECKPOINT_SHARED_REQUIRED
    value: 'true'
  - key: COST_PER_1K_TOKENS
    value: '{"@cf/meta/llama-3.3-70b-instruct-fp8-fast":0.0003,"@cf/baai/bge-base-en-v1.5":0.0001,"default":0.0003}'
  - key: RERANKER_MODEL
    # 2.3GB CrossEncoder OOMs the free 512Mi instance — LLM reranker fallback;
    # see live service env.
    value: ""
  - key: BACKEND_URL
    fromService:
      name: smart-doc-backend
      type: web
      property: host
# Keycloak SSO (free, prod issuer for SSO_OIDC_ISSUER_URI)
# Public URL will be https://smartdoc-keycloak.onrender.com/realms/smartdoc
- type: web
  name: smartdoc-keycloak
  runtime: docker
  plan: free
  dockerfilePath: docker/Dockerfile.keycloak
  autoDeploy: true
  healthCheckPath: /realms/master
  keep_alive: true
  auto_stop: false
  envVars:
  - key: KEYCLOAK_ADMIN
    value: admin
  - key: KEYCLOAK_ADMIN_PASSWORD
    sync: false
  - key: KC_HOSTNAME
    value: https://smartdoc-keycloak.onrender.com
  - key: KC_PROXY
    value: edge
