# SmartDoc production application — renders the helm/smartdoc chart
# (qdrant / llm-router / backend / frontend) with values-prod.yaml.
# Depends on PR #43 (feat/helm-chart) being merged into main.
#
# NOTE: destination server is a placeholder (in-cluster API server); see
# argocd/README.md for how to point this at a real cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartdoc-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: smartdoc-prod
    app.kubernetes.io/part-of: portfolio
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: https://github.com/imtarget05/Enterprise-Document-Intelligence-Corrective-RAG-Platform.git
    targetRevision: main
    path: helm/smartdoc
    helm:
      releaseName: smartdoc
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: smartdoc-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
