# Agent service (LangGraph orchestrator + HITL governance gate).
# Replicas share the approval queue through smartdoc-redis (16-redis.yaml),
# so a paused action survives pod restarts and is visible to every replica.
# REDIS_URL is composed from the same portfolio-secrets REDIS_PASSWORD the
# redis Deployment uses — Kubernetes expands $(...) against earlier env
# entries, so keep REDIS_PASSWORD first. The Spring backend reaches this
# service at http://smartdoc-agent:9000 (see AGENT_BASE_URL in
# 20-smartdoc-backend.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdoc-agent
  namespace: portfolio
  labels:
    app: smartdoc-agent
    role: agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartdoc-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: smartdoc-agent
        role: agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agent
        image: smart-doc-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9000
        env:
        - name: APP_ENV
          value: "production"
        - name: AGENT_PORT
          value: "9000"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portfolio-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@smartdoc-redis:6379/0"
        - name: HITL_STORE_BACKEND
          value: "redis"
        - name: HITL_FAIL_CLOSED
          value: "true"
        - name: HITL_REQUIRE_APPROVAL
          value: "true"
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: portfolio-secrets
              key: INTERNAL_SERVICE_TOKEN
        - name: LLM_BASE_URL
          value: "http://smartdoc-llm-router:8000"
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: smartdoc-agent
  namespace: portfolio
  labels:
    app: smartdoc-agent
spec:
  type: ClusterIP
  selector:
    app: smartdoc-agent
  ports:
  - name: http
    port: 9000
    targetPort: http
