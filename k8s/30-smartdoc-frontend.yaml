apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdoc-frontend
  namespace: portfolio
  labels:
    app: smartdoc-frontend
    role: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartdoc-frontend
  template:
    metadata:
      labels:
        app: smartdoc-frontend
        role: frontend
    spec:
      containers:
      - name: frontend
        image: smart-doc-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smartdoc-frontend
  namespace: portfolio
  labels:
    app: smartdoc-frontend
spec:
  type: ClusterIP
  selector:
    app: smartdoc-frontend
  ports:
  - name: http
    port: 80
    targetPort: http
