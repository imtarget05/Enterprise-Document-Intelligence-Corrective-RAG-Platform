apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdoc-frontend
  namespace: portfolio
  labels:
    app: smartdoc-frontend
    role: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartdoc-frontend
  template:
    metadata:
      labels:
        app: smartdoc-frontend
        role: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: smart-doc-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: BACKEND_UPSTREAM
          value: "smartdoc-backend:8080"
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: tmp
          mountPath: /tmp
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: nginx-config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smartdoc-frontend
  namespace: portfolio
  labels:
    app: smartdoc-frontend
spec:
  type: ClusterIP
  selector:
    app: smartdoc-frontend
  ports:
  - name: http
    port: 80
    targetPort: http
