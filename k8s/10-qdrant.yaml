apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdoc-qdrant
  namespace: portfolio
  labels:
    app: smartdoc-qdrant
    role: vector-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdoc-qdrant
  template:
    metadata:
      labels:
        app: smartdoc-qdrant
        role: vector-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.12.4
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 6333
        - name: grpc
          containerPort: 6334
        volumeMounts:
        - name: storage
          mountPath: /qdrant/storage
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: smartdoc-qdrant-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smartdoc-qdrant-data
  namespace: portfolio
  labels:
    app: smartdoc-qdrant
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: smartdoc-qdrant
  namespace: portfolio
  labels:
    app: smartdoc-qdrant
spec:
  type: ClusterIP
  selector:
    app: smartdoc-qdrant
  ports:
  - name: http
    port: 6333
    targetPort: http
  - name: grpc
    port: 6334
    targetPort: grpc
