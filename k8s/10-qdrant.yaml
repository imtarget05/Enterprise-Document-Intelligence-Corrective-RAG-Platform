apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdoc-qdrant
  namespace: portfolio
  labels:
    app: smartdoc-qdrant
    role: vector-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdoc-qdrant
  template:
    metadata:
      labels:
        app: smartdoc-qdrant
        role: vector-db
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - name: http
          containerPort: 6333
        - name: grpc
          containerPort: 6334
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smartdoc-qdrant
  namespace: portfolio
  labels:
    app: smartdoc-qdrant
spec:
  type: ClusterIP
  selector:
    app: smartdoc-qdrant
  ports:
  - name: http
    port: 6333
    targetPort: http
  - name: grpc
    port: 6334
    targetPort: grpc
