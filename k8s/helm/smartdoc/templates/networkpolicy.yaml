{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "smartdoc.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "smartdoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "smartdoc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    {{- toYaml .Values.networkPolicy.allowIngressFrom | nindent 4 }}
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- include "smartdoc.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.containerPort }}
{{- end }}
