{{- if .Values.service.backend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smartdoc.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "smartdoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
spec:
  type: {{ .Values.service.backend.type }}
  ports:
    - name: {{ .Values.service.backend.name }}
      port: {{ .Values.service.backend.port }}
      targetPort: {{ .Values.backend.containerPort }}
      protocol: TCP
  selector:
    {{- include "smartdoc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
