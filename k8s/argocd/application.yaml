apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartdocument-portfolio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: https://github.com/imtarget05/Enterprise-Document-Intelligence-Corrective-RAG-Platform.git
    targetRevision: main
    path: k8s
    kustomize:
      namePrefix: ""
      images: []
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
  revisionHistoryLimit: 10
