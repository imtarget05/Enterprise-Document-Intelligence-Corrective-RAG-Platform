{{- if .Values.deploy.frontend }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smartdoc.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "smartdoc.labels" . | nindent 4 }}
    app: smartdoc-frontend
spec:
  type: {{ .Values.service.frontend.type }}
  selector:
    app: smartdoc-frontend
  ports:
  - name: http
    port: {{ .Values.service.frontend.port }}
    targetPort: {{ .Values.service.frontend.targetPort }}
{{- end }}
