{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: smartdoc-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "smartdoc.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret.stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
