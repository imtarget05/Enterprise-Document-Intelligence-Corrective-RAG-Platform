apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartdoc-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: smartdoc-dev
    app.kubernetes.io/part-of: smartdoc-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: smartdoc-portfolio
  source:
    repoURL: "https://github.com/imtarget05/smartdoc.git"
    targetRevision: main
    path: infra/helm/smartdoc
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: smartdoc-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
