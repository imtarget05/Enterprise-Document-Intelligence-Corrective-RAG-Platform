global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: smartdoc-prod
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: smartdoc-backend
    static_configs:
      - targets: ["smartdoc-backend:8080"]
  - job_name: smartdoc-agent
    static_configs:
      - targets: ["smartdoc-agent:9000"]
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
